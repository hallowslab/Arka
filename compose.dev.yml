# Shared development environment. Pool default is solo for easy debugging;
# override *_CELERY_POOL to test gevent/threads/prefork locally.
x-dev-env: &dev_env
  DJANGO_ENV: development
  ARKA_LOGDIR: ${ARKA_LOGDIR:-/app/ARKA_LOGS}
  CONTAINER_USER: root
  MIMIR_GEOIP_DB_PATH: ${MIMIR_GEOIP_DB_PATH:-/app/data/mimir/dbip-city-lite.mmdb}

services:
  rabbitmq:
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
  postgres:
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
  arka:
    build:
      context: .
      target: development
      args:
        ENABLED_APPS: ${ENABLED_APPS:-""}
        MODULE_SOURCE: ${MODULE_SOURCE:-git}
    environment:
      <<: *dev_env
      STATIC_ROOT: /var/www/static
      ENABLED_APPS: ${ENABLED_APPS:-""}
    volumes:
      - shared_logs_dev:${ARKA_LOGDIR:-/app/ARKA_LOGS}
      - static_root_dev:/var/www/static
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - data_dev:/app/data
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
    ports:
      - "127.0.0.1:8000:8000"
    command: /app/scripts/django_init.sh

  forj:
    build:
      context: .
      target: development
      args:
        ENABLED_APPS: ${ENABLED_APPS:-""}
        MODULE_SOURCE: ${MODULE_SOURCE:-git}
    environment:
      <<: *dev_env
      CELERY_POOL: ${FORJ_CELERY_POOL:-solo}
      CELERY_CONCURRENCY: ${FORJ_CELERY_CONCURRENCY:-25}
    volumes:
      - shared_logs_dev:${ARKA_LOGDIR:-/app/ARKA_LOGS}
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
    command: /app/scripts/celery_init.sh worker

  forj-imapsync:
    build:
      context: .
      target: development
      args:
        ENABLED_APPS: ${ENABLED_APPS:-""}
        MODULE_SOURCE: ${MODULE_SOURCE:-git}
    environment:
      <<: *dev_env
      CELERY_POOL: ${IMAPSYNC_CELERY_POOL:-solo}
      CELERY_CONCURRENCY: ${IMAPSYNC_CELERY_CONCURRENCY:-25}
    volumes:
      - shared_logs_dev:${ARKA_LOGDIR:-/app/ARKA_LOGS}
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
    command: /app/scripts/celery_init.sh worker imapsync

  forj-mimir:
    build:
      context: .
      target: development
      args:
        ENABLED_APPS: ${ENABLED_APPS:-""}
        MODULE_SOURCE: ${MODULE_SOURCE:-git}
    environment:
      <<: *dev_env
      CELERY_POOL: ${MIMIR_CELERY_POOL:-solo}
      CELERY_CONCURRENCY: ${MIMIR_CELERY_CONCURRENCY:-25}
    volumes:
      - shared_logs_dev:${ARKA_LOGDIR:-/app/ARKA_LOGS}
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - data_dev:/app/data
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
    command: /app/scripts/celery_init.sh worker mimir

  forj-scheduler:
    build:
      context: .
      target: development
      args:
        ENABLED_APPS: ${ENABLED_APPS:-""}
        MODULE_SOURCE: ${MODULE_SOURCE:-git}
    environment:
      <<: *dev_env
    volumes:
      - shared_logs_dev:${ARKA_LOGDIR:-/app/ARKA_LOGS}
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
    command: /app/scripts/celery_init.sh beat

volumes:
  pgdata_dev:
  static_root_dev:
  rabbitmq_data_dev:
  shared_logs_dev:
  data_dev:
