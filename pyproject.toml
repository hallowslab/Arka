[project]
name = "arka"
version = "0.1.0"
description = "ARKA Modular Monolith"
authors = [
    {name = "hallowslab", email = "hallows.tech.lab@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "django-celery-results (>=2.6.0,<3.0.0)",
    "redis[hiredis] (>=5.0.1,<6.0.0)",
    "celery[redis] (>=5.5.3,<6.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "uvicorn-worker (>=0.4.0,<0.5.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "gevent (>=25.9.1,<26.0.0)",
    "requests>=2.32.3,<3.0.0",
]

[project.optional-dependencies]
aera = ["aera"]
bifrost = ["bifrost"]
dbtool = ["dbtool"]
mimir = ["mimir"]
mxr = ["mxr"]
nettools = ["nettools"]
pymap = ["pymap"]
all = ["aera", "bifrost", "dbtool", "mimir", "mxr", "nettools", "pymap"]

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "django-stubs[compatible-mypy] (>=5.2.6,<6.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.14.7,<0.15.0)",
    "poetry-version-exporter",
    "pytest (>=8.4.1,<9.0.0)",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.sources]
aera = { git = "https://github.com/hallowslab/AERA.git", branch = "dev" }
bifrost = { git = "https://github.com/hallowslab/BIFROST.git", branch = "dev" }
dbtool = { git = "https://github.com/hallowslab/DBTOOL.git", branch = "dev" }
mimir = { git = "https://github.com/hallowslab/MIMIR.git", branch = "dev" }
mxr = { git = "https://github.com/hallowslab/MXR.git", branch = "dev" }
nettools = { git = "https://github.com/hallowslab/NETTOOLS.git", branch = "dev" }
pymap = { git = "https://github.com/hallowslab/Pymap.git", branch = "modularize" }
poetry-version-exporter = { url = "https://github.com/hallowslab/poetry-version-exporter/releases/download/v0.2.0/poetry_version_exporter-0.2.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/arka", "src/forj"]

[tool.taskipy.tasks]
export-versions = "python scripts/dev_version.py"
lint = "task ruff_check && task ruff_format && task mypy"
ruff_check = "ruff check src"
ruff_format = "ruff format src"
mypy = "mypy ."
migrate = "python scripts/dev_migrate.py"
test = "python scripts/dev_test.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
